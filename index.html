<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="A generative audio-visual polyrhythm engine — hypnotic, evolving patterns of sound and motion.">
  <title>Polyrhythm Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <!-- Start Overlay (required for Web Audio context) -->
  <div id="start-overlay">
    <div class="start-card">
      <h1>Polyrhythm Engine</h1>
      <p class="subtitle">Generative audio-visual polyrhythms</p>
      <button id="start-btn">Begin Experience</button>
      <p class="hint">Audio requires user interaction to start</p>
    </div>
  </div>

  <!-- Control Panel -->
  <div id="controls" class="controls hidden">
    <button id="controls-toggle" class="controls-toggle" aria-label="Toggle controls">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
        <circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="1.5" />
        <circle cx="10" cy="10" r="3" stroke="currentColor" stroke-width="1.5" />
        <line x1="10" y1="2" x2="10" y2="0" stroke="currentColor" stroke-width="1.5" />
        <line x1="10" y1="20" x2="10" y2="18" stroke="currentColor" stroke-width="1.5" />
        <line x1="2" y1="10" x2="0" y2="10" stroke="currentColor" stroke-width="1.5" />
        <line x1="20" y1="10" x2="18" y2="10" stroke="currentColor" stroke-width="1.5" />
      </svg>
    </button>
    <div id="controls-panel" class="controls-panel">
      <div class="control-group">
        <label for="preset-select">Preset</label>
        <select id="preset-select"></select>
      </div>
      <div class="control-group">
        <label for="scene-select">Scene</label>
        <select id="scene-select">
          <option value="pendulum">Pendulum</option>
          <option value="bouncing-boxes">Bouncing Boxes</option>
          <option value="circular-orbits">Circular Orbits</option>
        </select>
      </div>
      <div class="control-group">
        <label for="bpm-slider">BPM <span id="bpm-value">60</span></label>
        <input type="number" id="bpm-number" min="0.01" max="120" value="60" step="0.01">
        <input type="range" id="bpm-slider" min="0.01" max="120" value="60" step="0.01">
      </div>
      <div class="control-group">
        <label for="volume-slider">Volume <span id="volume-value">80</span>%</label>
        <input type="range" id="volume-slider" min="0" max="100" value="80" step="1">
      </div>
      <div class="control-group">
        <button id="pause-btn" class="btn-secondary">Pause</button>
        <button id="advanced-btn" class="btn-secondary" style="margin-top: 10px;">Advanced...</button>
      </div>
    </div>
  </div>

  <!-- Advanced Modal -->
  <div id="advanced-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Custom Engine</h2>
        <button id="close-advanced" class="close-btn">&times;</button>
      </div>

      <div class="advanced-grid">
        <!-- Generator -->
        <div class="adv-section">
          <h3>Generator</h3>
          <div class="control-group">
            <label>Voice Count: <span id="adv-voice-count-val">10</span></label>
            <input type="range" id="adv-voice-count" min="1" max="100" value="10">
          </div>
          <div class="control-group">
            <label>Ratio Range</label>
            <div class="row">
              <input type="number" id="adv-ratio-start" step="0.01" value="1.00" class="input-sm">
              <span>to</span>
              <input type="number" id="adv-ratio-end" step="0.01" value="1.25" class="input-sm">
            </div>
          </div>
          <div class="control-group">
            <label>Motion/Easing</label>
            <select id="adv-easing" class="input-full"
              style="padding: 0.4rem; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; color: #fff;">
              <option value="sine">Sine (Pendulum)</option>
              <option value="linear">Linear (Triangle)</option>
              <option value="bounce">Bounce</option>
            </select>
          </div>
        </div>

        <!-- Harmony -->
        <div class="adv-section">
          <h3>Harmony</h3>
          <div class="control-group">
            <label>Scale</label>
            <select id="adv-scale"></select>
          </div>
          <div class="row">
            <div class="control-group">
              <label>Root</label>
              <input type="text" id="adv-root" value="C4" class="input-sm">
            </div>
            <div class="control-group">
              <label>Max</label>
              <input type="text" id="adv-max-note" value="C6" class="input-sm">
            </div>
          </div>
        </div>

        <!-- Progression -->
        <div class="adv-section">
          <h3>Progression</h3>
          <div class="control-group">
            <label>Chord Ratio: <span id="adv-chord-ratio-val">0.05</span></label>
            <input type="range" id="adv-chord-ratio" min="0" max="4" step="0.01" value="0.05">
          </div>
          <div class="control-group">
            <label>Chords (space separated)</label>
            <input type="text" id="adv-progression" value="C4 A3 F3 G3" placeholder="e.g. C4 G3" class="input-full">
          </div>
        </div>
      </div>

      <button id="apply-custom-btn" class="btn-primary">Generate & Apply</button>
    </div>
  </div>

  <!-- Info display -->
  <div id="info-display" class="info-display hidden">
    <span id="info-preset"></span>
    <span id="info-elapsed"></span>
  </div>



  <!-- Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

  <!-- App modules -->
  <script src="js/config.js"></script>
  <script src="js/timing-engine.js"></script>
  <script src="js/audio-layer.js"></script>
  <script src="js/scenes/pendulum.js"></script>
  <script src="js/scenes/bouncing-boxes.js"></script>
  <script src="js/scenes/circular-orbits.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/main.js"></script>
</body>

</html>
